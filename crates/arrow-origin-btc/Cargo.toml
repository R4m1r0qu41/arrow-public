[package]
name = "arrow-origin-btc"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Bitcoin Origin Adapter for the Arrow Protocol — UTXO-aware observer, 6-confirmation probabilistic finality."

license.workspace = true
[lib]
name = "arrow_origin_btc"
path = "src/lib.rs"

[dependencies]
arrow-adapter  = { path = "../arrow-adapter" }
arrow-core     = { path = "../arrow-core" }
arrow-origin-evm = { path = "../arrow-origin-evm" }
anyhow         = "1"
base64         = "0.22"
chrono         = "0.4"
serde_json     = "1"
uuid           = { version = "=1.4.1", features = ["v4"] }
bytes          = "1"
http-body-util = "0.1"
hyper          = { version = "=1.10.1", features = ["http1", "client"] }
hyper-util     = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
tokio          = { version = "=1.44.2", features = ["full"] }

[dev-dependencies]
arrow-core = { path = "../arrow-core" }
