[package]
name = "arrow-adapter"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Shared Arrow Protocol adapter boundary, interchange contract, provenance, idempotency, and conformance helpers."

license.workspace = true
[dependencies]
arrow-core      = { path = "../arrow-core" }
arrow-reduce    = { path = "../arrow-reduce" }
arrow-transport = { path = "../arrow-transport" }
chrono          = { version = "0.4", features = ["serde"] }
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
sha2            = "0.10"
hex             = "0.4"
thiserror       = "2"
