[package]
name = "arrow-identity"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "DID-based identity resolution and signature verification for Arrow Protocol"

license.workspace = true
[features]
default = ["did-key"]
did-key = []
did-web = ["dep:reqwest"]

[dependencies]
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
thiserror        = "2"
ed25519-dalek    = { version = "=3.0.0", features = ["rand_core"] }
bs58             = "0.5"
base64           = "0.22"
rand_core        = { version = "=0.6.4", features = ["getrandom"] }
reqwest          = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"], optional = true }
indexmap          = { workspace = true }
hashbrown         = { workspace = true }
base64ct         = "=1.6.0"
