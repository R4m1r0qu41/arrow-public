[package]
name = "arrow-consume-btc"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Arrow Protocol Consumption Adapter for Bitcoin — RecordOnly in v0.1; no live UTXO selection, signing, or broadcast."

license.workspace = true
[lib]
name = "arrow_consume_btc"
path = "src/lib.rs"

[dependencies]
arrow-adapter  = { path = "../arrow-adapter" }
arrow-core     = { path = "../arrow-core" }
arrow-identity = { path = "../arrow-identity" }
arrow-transport = { path = "../arrow-transport", features = ["replay-sqlite"] }
arrow-reduce   = { path = "../arrow-reduce" }
anyhow         = "1"
base64         = "0.22"

[dev-dependencies]
arrow-core        = { path = "../arrow-core" }
arrow-origin-btc  = { path = "../arrow-origin-btc" }
