[package]
name = "arrow-origin-eth"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Ethereum Origin Adapter for the Arrow Protocol — observes a chain transaction and mints a signed Arrow event."

license.workspace = true
[[bin]]
name = "arrow-origin-eth"
path = "src/main.rs"

[lib]
name = "arrow_origin_eth"
path = "src/lib.rs"

[dependencies]
# Ethereum is a thin chain-config shell over the shared EVM-family library.
arrow-origin-evm = { path = "../arrow-origin-evm" }
arrow-core       = { path = "../arrow-core" }
serde_json       = "1"
anyhow           = "1"
clap             = { version = "=4.4.18", features = ["derive"] }

[dev-dependencies]
arrow-core = { path = "../arrow-core" }
