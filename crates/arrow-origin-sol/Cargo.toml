[package]
name = "arrow-origin-sol"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Solana Origin Adapter for the Arrow Protocol — commitment-based finality, native_canonical regime."

license.workspace = true
[lib]
name = "arrow_origin_sol"
path = "src/lib.rs"

[dependencies]
arrow-adapter    = { path = "../arrow-adapter" }
arrow-core       = { path = "../arrow-core" }
arrow-origin-evm = { path = "../arrow-origin-evm" }
anyhow           = "1"
chrono           = "0.4"
serde_json       = "1"
uuid             = { version = "=1.4.1", features = ["v4"] }
bytes            = "1"
http-body-util   = "0.1"
hyper            = { version = "=1.10.1", features = ["http1", "client"] }
hyper-util       = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
reqwest          = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio            = { version = "=1.54.1", features = ["full"] }

[dev-dependencies]
arrow-core = { path = "../arrow-core" }
