[package]
name = "arrow-consume-evm"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

license.workspace = true
[dependencies]
arrow-adapter   = { path = "../arrow-adapter" }
arrow-core      = { path = "../arrow-core" }
arrow-reduce    = { path = "../arrow-reduce" }
arrow-identity  = { path = "../arrow-identity" }
arrow-transport = { path = "../arrow-transport", features = ["replay-sqlite"] }
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
anyhow          = "1"
base64          = "0.22"
bytes           = "1"
hex             = "0.4"
http-body-util  = "0.1"
tokio           = { version = "=1.54.1", features = ["full"] }
hyper           = { version = "=1.10.1", features = ["http1", "client", "server"] }
hyper-util      = { version = "0.1", features = ["client-legacy", "http1", "server", "tokio"] }
# §4.4 — EIP-155 raw transaction signing. k256 provides minimal secp256k1 ECDSA
# without pulling a full Ethereum client. sha3 provides keccak256 for tx hashing.
# Both are from the RustCrypto family (same maintainers as sha2 already in use).
k256            = { version = "=0.13.3", features = ["ecdsa"] }
sha3            = "=0.10.8"

[dev-dependencies]
arrow-core       = { path = "../arrow-core" }
arrow-origin-evm = { path = "../arrow-origin-evm" }
