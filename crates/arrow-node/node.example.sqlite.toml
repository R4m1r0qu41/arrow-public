listen     = "127.0.0.1:8080"
node_id    = "did:arrow:pilot:node-a"
registries = "embedded"

[channel]
binding = "http-rest-local"
public_base_url = "http://127.0.0.1:8080"

[tls]
mode = "local-disabled"
require_forwarded_proto_https = false

[replay]
# Durable replay protection via SQLite. Nonces survive process restarts.
backend = "sqlite"
path = "/var/lib/arrow/replay.db"

[known_senders]
allow = [
  "did:key:z6MktULudTtAsAhRegYPiZ6631RV3viv12qd4GQF8z1xB22S",
  "did:key:z6MkqGC3nWZhYieEVTVDKW5v588CiGfsDSmRVG9ZwwWTvLSK",
  "did:key:z6Mkg49NtQR2LyYRDCQFK4w1VVHqhypZSSRo7HsyuN7SV7v5",
]

# Identity / signature policy. Required for the v0.2 node startup profile.
[identity]
require_signature = true
allowed_did_methods = ["did:key"]
allowed_algorithms = ["Ed25519"]
